    // For languages not fully translated, use English
    function getContent(lang) {

        t = translations['en'];
        lang = 'en';

        <h1>${t.title}</h1>
        <p class="last-updated">${t.lastUpdated}</p>

        <h2>${t.section1Title}</h2>
        <p>${t.intro}</p>

        <h3>${t.section2aTitle}</h3>
        <ul>
          ${t.section2aList.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h3>${t.section2bTitle}</h3>
        <ul>
          ${t.section2bList.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>${t.section3Title}</h2>
        <ul>
          ${t.section3List.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>${t.section4Title}</h2>
        <ul>
          ${t.section4List.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>${t.section5Title}</h2>
        <p>${t.section5Intro}</p>
        <ul>
          ${t.section5List.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>${t.section6Title}</h2>
        <ul>
          ${t.section6List.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>${t.section7Title}</h2>
        <ol>
          ${t.section7Steps.map(item => `<li>${item}</li>`).join('')}
        </ol>
        <p>${t.section7Note}</p>

        <h2>${t.section8Title}</h2>
        <p>${t.section8Text}</p>

        <h2>${t.section9Title}</h2>
        <p>${t.section9Text}</p>

        <h2>${t.section10Title}</h2>
        <p>${t.section10Text}</p>
        <div class="contact">
          <p>${t.email}</p>
        </div>

        <hr style="margin-top: 40px; border: none; border-top: 1px solid #eee;" />
        <p style="color: #999; font-size: 12px; text-align: center;">© 2026 Talko. All rights reserved.</p>
      `;
    }

    function switchLanguage(lang) {
      document.getElementById('content').innerHTML = getContent(lang);
      document.documentElement.lang = lang;
      localStorage.setItem('talko_privacy_lang', lang);
    }

    window.onload = function() {
      let savedLang = localStorage.getItem('talko_privacy_lang');
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      
      if (urlLang) {
        savedLang = urlLang;
      } else if (!savedLang) {
        const browserLang = navigator.language || navigator.userLanguage;
        savedLang = browserLang.split('-')[0];
      }
      
      const select = document.getElementById('langSelect');
      if (savedLang && translations[savedLang]) {
        select.value = savedLang;
      } else {
        select.value = 'en';
      }
      
      switchLanguage(select.value);
    };
